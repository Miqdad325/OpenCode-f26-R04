name: Continuous Deployment
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, crs-17313-demo]
    steps:
      - name: Deploy VM
        run: |
          cd "$HOME/OpenCode-f26-R04"
          git pull origin dev
          docker compose up --build -d
          docker compose ps
